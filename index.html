<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Place Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="panel">
    <h1>Place Finder</h1>
    <p class="hint">Gambar area di peta (polygon, kotak, atau lingkaran), pilih kategori, lalu cari tempat di dalamnya.</p>

    <form id="geocode" autocomplete="off">
      <input id="geocode-q" type="search" placeholder="Pindah ke lokasi, mis. Bandung">
      <button type="submit">Pergi</button>
    </form>

    <label for="category">Kategori</label>
    <select id="category"></select>

    <div id="custom-tag" hidden>
      <input id="custom-key" placeholder="key (mis. amenity)">
      <input id="custom-value" placeholder="value (mis. cafe)">
    </div>

    <button id="search" disabled>Cari tempat</button>
    <button id="clear" class="secondary" disabled>Hapus area</button>

    <div id="status" role="status"></div>

    <div id="results-head" hidden>
      <strong id="count"></strong>
      <span>
        <button id="dl-csv" class="secondary small">CSV</button>
        <button id="dl-json" class="secondary small">GeoJSON</button>
      </span>
    </div>
    <ul id="results"></ul>

    <p class="attr">Data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a> (ODbL), via Overpass API.</p>
  </aside>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="lib.js"></script>
  <script src="app.js"></script>
</body>
</html>
