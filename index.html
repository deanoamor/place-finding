<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Place Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <aside id="panel">
    <h1>Place Finder</h1>
    <p class="hint">Gambar area di peta (polygon, kotak, atau lingkaran), pilih kategori, lalu cari tempat di dalamnya.</p>

    <form id="geocode" autocomplete="off">
      <input id="geocode-q" type="search" placeholder="Pindah ke lokasi, mis. Bandung">
      <button type="submit">Pergi</button>
    </form>

    <label>1. Gambar area pencarian</label>
    <div id="tools">
      <button type="button" class="secondary" data-tool="polygon">Polygon</button>
      <button type="button" class="secondary" data-tool="freehand">Coret bebas</button>
      <button type="button" class="secondary" data-tool="rectangle">Kotak</button>
      <button type="button" class="secondary" data-tool="circle">Lingkaran</button>
    </div>
    <p id="tool-hint" class="hint">Pilih salah satu bentuk, lalu gambar langsung di peta.</p>

    <label for="category">2. Kategori</label>
    <select id="category"></select>

    <div id="custom-tag" hidden>
      <input id="custom-key" placeholder="key (mis. amenity)">
      <input id="custom-value" placeholder="value (mis. cafe)">
    </div>

    <button id="search" disabled>3. Cari tempat</button>
    <button id="clear" class="secondary" disabled>Hapus area</button>

    <div id="status" role="status"></div>

    <section id="detail" hidden>
      <button id="back" type="button" class="secondary small">← Daftar hasil</button>
      <h2 id="d-name"></h2>
      <div id="d-sub" class="meta"></div>
      <div id="d-actions"></div>
      <div id="d-body"></div>
      <details id="d-raw">
        <summary>Data mentah OSM (<span id="d-count"></span> tag)</summary>
        <table id="d-table"></table>
      </details>
    </section>

    <div id="results-head" hidden>
      <strong id="count"></strong>
      <span>
        <button id="dl-csv" class="secondary small">CSV</button>
        <button id="dl-json" class="secondary small">GeoJSON</button>
      </span>
    </div>
    <ul id="results"></ul>

    <p class="attr">Data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a> (ODbL), via Overpass API.</p>
  </aside>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="lib.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
